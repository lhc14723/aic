project_root: ..

data: data/processed/aic_multispectral.yaml
model: yolo26s-p2.yaml
pretrained: outputs/aic_fusion_stage1_4090d_clean/weights/best.pt

tri_augment:
  probability: 0.60
  infrared_gain: 0.10
  depth_hole_probability: 0.15
  modality_dropout_probability: 0.04

train:
  project: outputs
  name: aic_fusion_highres_4090d_clean
  exist_ok: true
  epochs: 45
  patience: 20
  imgsz: 1280
  batch: 1
  workers: 4
  device: 0
  resume: outputs/aic_fusion_highres_4090d_clean/weights/last_resume.pt
  amp: false
  cache: false
  optimizer: AdamW
  lr0: 0.00025
  lrf: 0.10
  weight_decay: 0.0005
  warmup_epochs: 2
  cos_lr: true
  close_mosaic: 10
  box: 7.5
  cls: 0.5
  cls_pw: 0.15
  dfl: 1.5
  degrees: 2.0
  translate: 0.05
  scale: 0.25
  shear: 0.5
  perspective: 0.0001
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.20
  mixup: 0.0
  cutmix: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  max_det: 100
  seed: 2027
  deterministic: true
  save_period: 5
  plots: true
  verbose: true
