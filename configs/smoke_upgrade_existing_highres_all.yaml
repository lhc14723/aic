project_root: ..

# Runtime and memory probe for route A. This run uses only 5% of the data for
# one epoch; its checkpoint and validation metric must never be submitted.
data: data/processed/aic_multispectral_all.yaml
model: yolo26s-p2.yaml
pretrained: weights/final_all_4090d_clean/best.pt
fusion_variant: v1

tri_augment:
  probability: 0.35
  infrared_gain: 0.06
  depth_hole_probability: 0.05
  modality_dropout_probability: 0.0

train:
  project: outputs
  name: smoke_upgrade_existing_highres_all_do_not_submit
  exist_ok: false
  epochs: 1
  patience: 1
  fraction: 0.05
  imgsz: 1280
  rect: true
  batch: 2
  workers: 0
  device: 0
  amp: true
  cache: false
  optimizer: AdamW
  lr0: 0.00005
  lrf: 0.20
  weight_decay: 0.0005
  warmup_epochs: 0
  cos_lr: true
  close_mosaic: 0
  box: 8.0
  cls: 0.55
  cls_pw: 0.20
  dfl: 1.75
  degrees: 1.0
  translate: 0.02
  scale: 0.12
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  max_det: 100
  seed: 2036
  deterministic: true
  save_period: -1
  plots: false
  save: false
  val: false
  verbose: true
