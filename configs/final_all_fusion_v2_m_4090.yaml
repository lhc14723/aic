project_root: ..

# Stage 3: use all 2000 official training images only after model selection and
# hyperparameters have been frozen on the clean stage-1/stage-2 validation.
data: data/processed/aic_multispectral_all.yaml
model: yolo26m-p2.yaml
pretrained: outputs/aic_fusion_v2_m_highres_4090/weights/best.pt
fusion_variant: v2

tri_augment:
  probability: 0.30
  infrared_gain: 0.05
  depth_hole_probability: 0.03
  modality_dropout_probability: 0.0

train:
  project: outputs
  name: aic_fusion_v2_m_final_all_4090
  exist_ok: false
  epochs: 20
  patience: 20
  imgsz: 1280
  rect: true
  batch: 4
  workers: 4
  device: 0
  amp: true
  cache: false
  optimizer: AdamW
  lr0: 0.00008
  lrf: 0.15
  weight_decay: 0.0005
  warmup_epochs: 1
  cos_lr: true
  close_mosaic: 0
  box: 8.0
  cls: 0.55
  cls_pw: 0.20
  dfl: 1.75
  degrees: 0.8
  translate: 0.02
  scale: 0.10
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  max_det: 100
  seed: 2043
  deterministic: true
  save_period: 5
  val: false
  plots: true
  verbose: true
