project_root: ..

# Localization refinement after the clean V2 stage. Rectangular batches retain
# more source detail at 1280 while fitting an 8 GB local GPU with batch 2.
data: data/processed/aic_multispectral.yaml
model: yolo26s-p2.yaml
pretrained: outputs/aic_fusion_v2_clean_stage1/weights/best.pt
fusion_variant: v2

tri_augment:
  probability: 0.40
  infrared_gain: 0.06
  depth_hole_probability: 0.05
  modality_dropout_probability: 0.0

train:
  project: outputs
  name: aic_fusion_v2_clean_highres
  exist_ok: false
  epochs: 40
  patience: 15
  imgsz: 1280
  rect: true
  batch: 2
  workers: 1
  device: 0
  amp: true
  cache: false
  optimizer: AdamW
  lr0: 0.00020
  lrf: 0.10
  weight_decay: 0.0005
  warmup_epochs: 2
  cos_lr: true
  close_mosaic: 0
  box: 8.0
  cls: 0.55
  cls_pw: 0.25
  dfl: 1.75
  degrees: 1.0
  translate: 0.02
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  max_det: 100
  seed: 2033
  deterministic: true
  save_period: 5
  plots: true
  verbose: true
